<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a2c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Pilot Academy"><meta name="description" content="Offline-PPL-Lerntrainer Deutsch und Polnisch"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Pilot Academy · PPL(A)</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0c1422;color:#f3f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0%,#223b59,#0c1422 40%)}main{max-width:850px;margin:auto;padding:22px 17px 90px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{font-weight:800;letter-spacing:.4px;font-size:19px}.wing{color:#71dbe5}small,.muted{color:#a5b7cb}h1{font-size:32px;line-height:1.1;margin:10px 0}h2{font-size:21px}h3{margin-bottom:7px}p{line-height:1.55}button,select{font:inherit}button{cursor:pointer;border:1px solid #344963;background:#1b3047;color:#fff;border-radius:12px;padding:11px 14px}button.primary{background:#63d0d4;color:#0c1725;font-weight:800;border:0}button:disabled{opacity:.45}button:focus-visible{outline:3px solid #fff}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.active{background:#63d0d4!important;color:#091823!important}.card{background:#142338;border:1px solid #2a4059;border-radius:19px;padding:19px;margin-bottom:14px}.hero{padding:24px;background:linear-gradient(140deg,#254560,#15263b)}.eyebrow{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:#86e1e6;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.subject{min-height:112px;text-align:left;width:100%;display:flex;flex-direction:column;justify-content:space-between}.number{font-size:12px;color:#85d8df}.badge{display:inline-block;padding:5px 9px;background:#29475d;border-radius:99px;color:#a6eced;font-size:12px}.options{display:grid;gap:9px;margin-top:18px}.options button{text-align:left}.options .correct{background:#124f46;border-color:#41bf9e}.options .wrong{background:#5b2e39;border-color:#db828b}.progress{height:8px;border-radius:20px;background:#35475b;overflow:hidden}.progress div{height:100%;background:#62d6cf}.term{border-top:1px solid #34475d;padding:9px 0}.lesson-content{font-size:17px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}footer{font-size:12px;color:#98adc1;line-height:1.6;padding:15px 4px}.pill{padding:5px 11px;border-radius:50px;font-size:13px}.visual{height:150px;display:flex;justify-content:center;align-items:center;font-size:75px;background:radial-gradient(ellipse,#234762,#11233a);border-radius:16px;margin:14px 0}.success{color:#85e3c1}.warn{color:#ffdc87}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}h1{font-size:39px}}
</style></head><body><main><header><div class="brand"><span class="wing">✈</span> PILOT ACADEMY <small>· PPL(A)</small></div><span class="badge" id="offline">Offline bereit</span></header><nav><button data-tab="home" class="active">Start</button><button data-tab="subjects">Fächer</button><button data-tab="book">Lehrbuch</button><button data-tab="quiz">Training</button><button data-tab="settings">Einstellungen</button></nav><div id="view"></div><footer>Privates Lernprototyp-Konzept · Kein offizieller EASA-Prüfungsfragenkatalog und kein Ersatz für eine zugelassene Flugschule. Keine operativen Flugentscheidungen auf Basis dieser App treffen. Daten bleiben auf diesem Gerät, solange Safari sie nicht löscht.</footer></main><script>
const subjects=[['Grundlagen des Fliegens','Zasady lotu','Aerodynamik, Auftrieb, Widerstand'],['Allgemeine Luftfahrzeugkunde','Ogólna wiedza o statku powietrznym','Motor, Struktur, Instrumente'],['Meteorologie','Meteorologia','Wetter, Wind, Wolken'],['Navigation','Nawigacja','Karten, Kurse, GPS'],['Luftrecht','Prawo lotnicze','Flugregeln und Lufträume'],['Flugleistung und Flugplanung','Osiągi i planowanie lotu','Masse, Schwerpunkt, Startstrecke'],['Menschliches Leistungsvermögen','Człowiek – możliwości i ograniczenia','Sauerstoff, Müdigkeit, Entscheidungen'],['Betriebliche Verfahren','Procedury operacyjne','Checklisten, Notfälle'],['Kommunikation','Łączność','Flugfunk und Phraseologie']];
const lessons=[{subject:0,title:'Warum fliegt ein Flugzeug?',pl:'Dlaczego samolot lata?',icon:'🛩️',de:['Beim Fliegen wirken vier Kräfte: Auftrieb, Gewichtskraft, Schub und Luftwiderstand.','Die Tragfläche erzeugt durch ihre Umströmung eine Druckverteilung und lenkt Luft nach unten ab. Die resultierende Kraft nach oben nennen wir Auftrieb.','Damit ein Flugzeug im geraden, gleichförmigen Horizontalflug bleibt, gleichen sich Auftrieb und Gewichtskraft sowie Schub und Widerstand aus.','Der Anstellwinkel ist der Winkel zwischen Profilsehne und anströmender Luft. Ein zu großer Anstellwinkel kann zum Strömungsabriss führen.'],pltext:['Na samolot w locie działają cztery siły: siła nośna, ciężar, ciąg i opór aerodynamiczny.','Skrzydło wytwarza rozkład ciśnienia i odchyla strumień powietrza w dół. Powstającą siłę skierowaną do góry nazywamy siłą nośną.','W ustalonym locie poziomym siła nośna równoważy ciężar, a ciąg równoważy opór.','Kąt natarcia to kąt między cięciwą profilu a kierunkiem napływającego powietrza. Zbyt duży kąt może wywołać przeciągnięcie.'],terms:[['Auftrieb','siła nośna'],['Schub','ciąg'],['Widerstand','opór'],['Anstellwinkel','kąt natarcia']]},{subject:2,title:'Was ist Wind?',pl:'Czym jest wiatr?',icon:'🌤️',de:['Wind bezeichnet die Bewegung der Luft relativ zum Boden.','Gegenwind reduziert bei gleicher Fluggeschwindigkeit gegenüber der Luft die Geschwindigkeit über Grund; Rückenwind erhöht sie.','Für die Flugplanung sind Windrichtung, Windstärke und Böen wichtig.'],pltext:['Wiatr to ruch powietrza względem powierzchni ziemi.','Wiatr przeciwny zmniejsza prędkość względem ziemi przy tej samej prędkości względem powietrza; wiatr tylny ją zwiększa.','Podczas planowania lotu ważne są kierunek i prędkość wiatru oraz porywy.'],terms:[['Gegenwind','wiatr przeciwny'],['Rückenwind','wiatr tylny'],['Böe','poryw wiatru']]},{subject:3,title:'Geschwindigkeit über Grund',pl:'Prędkość względem ziemi',icon:'🧭',de:['Die Eigengeschwindigkeit (TAS) beschreibt die Bewegung des Flugzeugs gegenüber der Luft.','Die Geschwindigkeit über Grund (GS) ist die Bewegung gegenüber der Erdoberfläche. Wind verändert die Geschwindigkeit über Grund.','Beispiel: 180 km/h TAS und 20 km/h direkter Gegenwind ergeben 160 km/h GS.'],pltext:['Prędkość rzeczywista (TAS) opisuje ruch samolotu względem powietrza.','Prędkość względem ziemi (GS) opisuje ruch względem powierzchni ziemi. Wiatr zmienia GS.','Przykład: 180 km/h TAS i 20 km/h wiatru czołowego dają 160 km/h GS.'],terms:[['Eigengeschwindigkeit','prędkość rzeczywista'],['Geschwindigkeit über Grund','prędkość względem ziemi']]},{subject:1,title:'Die vier Hauptteile',pl:'Główne części samolotu',icon:'⚙️',de:['Ein typisches Flugzeug besitzt einen Rumpf, Tragflächen, ein Leitwerk und ein Antriebssystem.','Querruder steuern die Rollbewegung, Höhenruder die Nickbewegung und Seitenruder die Gierbewegung.'],pltext:['Typowy samolot ma kadłub, skrzydła, usterzenie i układ napędowy.','Lotki sterują przechyleniem, ster wysokości pochyleniem, a ster kierunku odchyleniem.'],terms:[['Rumpf','kadłub'],['Leitwerk','usterzenie'],['Querruder','lotki']] }];
const questions=[{q:'Welche Kraft wirkt der Gewichtskraft im stationären Horizontalflug entgegen?',pl:'Która siła równoważy ciężar podczas ustalonego lotu poziomego?',o:['Auftrieb','Luftwiderstand','Schub'],correct:0,why:'Der Auftrieb gleicht im geraden, gleichförmigen Horizontalflug die Gewichtskraft aus.',subject:0},{q:'Was kann passieren, wenn der kritische Anstellwinkel überschritten wird?',pl:'Co może się stać po przekroczeniu krytycznego kąta natarcia?',o:['Strömungsabriss','Automatische Beschleunigung','Mehr Kraftstoff im Tank'],correct:0,why:'Ein zu großer Anstellwinkel kann die Strömung am Flügel teilweise ablösen.',subject:0},{q:'Was bewirkt direkter Gegenwind bei gleicher TAS?',pl:'Jak działa wiatr czołowy przy tej samej TAS?',o:['Geringere Geschwindigkeit über Grund','Höhere Geschwindigkeit über Grund','Keine Veränderung der Geschwindigkeit über Grund'],correct:0,why:'Gegenwind verringert die Groundspeed.',subject:3},{q:'Welche Größe beschreibt die Bewegung gegenüber der Luft?',pl:'Która wielkość opisuje ruch względem powietrza?',o:['TAS','GS','Flughöhe'],correct:0,why:'TAS ist die wahre Fluggeschwindigkeit gegenüber der Luft.',subject:3},{q:'Welches Ruder steuert primär die Rollbewegung?',pl:'Który ster steruje głównie przechyleniem?',o:['Querruder','Seitenruder','Höhenruder'],correct:0,why:'Die Querruder verändern die Auftriebsverteilung und erzeugen ein Rollmoment.',subject:1},{q:'Was bedeutet eine Böe?',pl:'Co oznacza poryw wiatru?',o:['Eine kurzfristige Änderung der Windgeschwindigkeit','Eine unveränderte Windstille','Ein festes Luftdruckniveau'],correct:0,why:'Böen sind kurzfristige Schwankungen der Windgeschwindigkeit.',subject:2}];
let state={tab:'home',lang:'de',currentLesson:0,q:0,answered:null,...JSON.parse(localStorage.getItem('pilot-academy-state')||'{}')};state.answered=null;function store(){localStorage.setItem('pilot-academy-state',JSON.stringify({lang:state.lang,currentLesson:state.currentLesson,done:state.done||[],score:state.score||0,attempts:state.attempts||0}))}function htmlSafe(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function speak(t){if(!('speechSynthesis'in window))return alert('Sprachausgabe nicht verfügbar');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=state.lang==='de'?'de-DE':'pl-PL';u.rate=.88;speechSynthesis.speak(u)}function tab(n){state.tab=n;render()}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));let v=document.querySelector('#view');const done=state.done||[];if(state.tab==='home')v.innerHTML=`<section class="card hero"><div class="eyebrow">Deine persönliche Flugakademie</div><h1>Schritt für Schritt<br>zum PPL(A)</h1><p>Deutsch zuerst, Polnisch jederzeit. Lernen ohne Druck – im eigenen Tempo.</p><div class="progress"><div style="width:${Math.round(100*done.length/lessons.length)}%"></div></div><p class="muted">${done.length} von ${lessons.length} Einstiegslektionen abgeschlossen</p><button class="primary" onclick="openLesson(${state.currentLesson||0})">Lernen fortsetzen →</button></section><div class="grid"><button class="card subject" onclick="tab('book')"><span>📘 Lehrbuch</span><b>Offline lesen</b></button><button class="card subject" onclick="tab('quiz')"><span>🎯 Training</span><b>${state.attempts||0} Antworten geübt</b></button><button class="card subject" onclick="tab('subjects')"><span>🧭 Lehrplan</span><b>9 PPL-Fächer</b></button></div>`;
else if(state.tab==='subjects')v.innerHTML='<h1>Die 9 PPL-Fächer</h1><p class="muted">Der offizielle Themenrahmen; die ersten vier Beispiellektionen sind verfügbar.</p><div class="grid">'+subjects.map((s,i)=>`<button class="card subject" onclick="openSubject(${i})"><span class="number">Fach ${i+1}</span><b>${s[0]}</b><small>${s[1]}</small></button>`).join('')+'</div>';
else if(state.tab==='book')v.innerHTML='<h1>Dein Lehrbuch</h1><p>Kurze Einsteigerkapitel auf Deutsch und Polnisch, lokal verfügbar.</p>'+lessons.map((l,i)=>`<button class="card" style="width:100%;text-align:left" onclick="openLesson(${i})"><b>${l.icon} Kapitel ${i+1}: ${l.title}</b><p class="muted">${l.pl} ${done.includes(i)?'· ✓ Gelesen':''}</p></button>`).join('');
else if(state.tab==='quiz'){let q=questions[state.q%questions.length];v.innerHTML=`<div class="eyebrow">Lernkontrolle · Frage ${state.q%questions.length+1}/${questions.length}</div><h1>Prüfungstraining</h1><div class="card"><h2>${state.lang==='de'?q.q:q.pl}</h2><div class="actions"><button onclick="speak(${JSON.stringify(state.lang==='de'?q.q:q.pl).replaceAll('"','&quot;')})">🔊 Vorlesen</button></div><div class="options">${q.o.map((o,i)=>`<button id="opt${i}" onclick="answer(${i})">${String.fromCharCode(65+i)} · ${o}</button>`).join('')}</div><p id="feedback" aria-live="polite"></p><button class="primary" id="next" style="display:none" onclick="nextQ()">Nächste Frage →</button></div><p class="muted">${state.score||0} von ${state.attempts||0} Antworten richtig. Fragen sind eigene Übungsbeispiele, keine offiziellen Prüfungsfragen.</p>`;}
else if(state.tab==='settings')v.innerHTML=`<h1>Einstellungen</h1><div class="card"><h3>Unterrichtssprache</h3><div class="actions"><button class="${state.lang==='de'?'active':''}" onclick="language('de')">Deutsch</button><button class="${state.lang==='pl'?'active':''}" onclick="language('pl')">Polski</button></div><p>Audio nutzt die auf dem Gerät verfügbaren Stimmen. Freie Sprach-KI und zuverlässige Offline-Spracherkennung sind in diesem Prototyp noch nicht enthalten.</p></div><div class="card"><h3>Offline & Datenschutz</h3><p>Nach Installation über HTTPS werden die App-Dateien lokal zwischengespeichert. Lernfortschritt wird im lokalen Browser-Speicher gespeichert. Löscht iOS Website-Daten, kann der Fortschritt verloren gehen.</p><button onclick="if(confirm('Fortschritt wirklich zurücksetzen?')){localStorage.removeItem('pilot-academy-state');location.reload()}">Fortschritt löschen</button></div>`;
}
function openSubject(i){let l=lessons.findIndex(x=>x.subject===i);if(l>=0)openLesson(l);else{state.tab='subjects';render();alert('Für dieses Fach folgt das ausführliche Kapitel in einer späteren Version.')}}function openLesson(i){state.currentLesson=i;state.tab='lesson';let l=lessons[i],arr=state.lang==='de'?l.de:l.pltext;document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));document.querySelector('#view').innerHTML=`<button onclick="tab('book')">← Lehrbuch</button><div class="card"><span class="eyebrow">Kapitel ${i+1} · ${subjects[l.subject][0]}</span><h1>${state.lang==='de'?l.title:l.pl}</h1><div class="visual">${l.icon}</div><div class="actions"><button onclick="language('de');openLesson(${i})">Deutsch</button><button onclick="language('pl');openLesson(${i})">Polski</button><button onclick="speakCurrent()">🔊 Vorlesen</button><button onclick="speechSynthesis.cancel()">■ Stopp</button></div><div class="lesson-content">${arr.map(t=>`<p>${htmlSafe(t)}</p>`).join('')}</div><h3>Deutsch – Polski</h3>${l.terms.map(t=>`<div class="term">${t[0]} <span class="muted">→ ${t[1]}</span></div>`).join('')}<p><button class="primary" onclick="finishLesson(${i})">✓ Kapitel gelesen</button></p></div>`;store()};function speakCurrent(){let l=lessons[state.currentLesson];speak((state.lang==='de'?l.de:l.pltext).join(' '))}function finishLesson(i){state.done=state.done||[];if(!state.done.includes(i))state.done.push(i);store();tab('quiz')}function language(l){state.lang=l;store();render()}function answer(i){if(state.answered!==null)return;let q=questions[state.q%questions.length];state.answered=i;state.attempts=(state.attempts||0)+1;if(i===q.correct)state.score=(state.score||0)+1;document.querySelectorAll('.options button').forEach((b,n)=>{b.disabled=true;if(n===q.correct)b.classList.add('correct');if(n===i&&n!==q.correct)b.classList.add('wrong')});document.querySelector('#feedback').innerHTML=`<strong class="${i===q.correct?'success':'warn'}">${i===q.correct?'Richtig!':'Noch nicht ganz.'}</strong> ${q.why}`;document.querySelector('#next').style.display='inline-block';store()}function nextQ(){state.q++;state.answered=null;render()}document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>tab(b.dataset.tab)));if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});document.querySelector('#offline').textContent=navigator.onLine?'Offline-Inhalte':'Offline-Modus';window.addEventListener('online',()=>document.querySelector('#offline').textContent='Offline-Inhalte');window.addEventListener('offline',()=>document.querySelector('#offline').textContent='Offline-Modus');render();
</script></body></html>
